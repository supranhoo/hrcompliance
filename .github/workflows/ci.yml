name: ci
on:
  push:
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Privacy guard (PRV-02): no confidential source data / pseudonym key / output directories tracked, no forbidden artifact uploads; the self-test proves it bites.
      - run: scripts/validation/check-no-confidential-files.sh && scripts/validation/test-confidential-guard.sh
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # DEV verification automation (no credentials, no network): the storage smoke test is proven against a mock that must FAIL when any protection is removed,
      # and the workflow wiring checks (triggers, environment, branch, secret allow-lists, no migrations/artifacts/service-role) must reject every loosening.
      - run: node scripts/validation/test-dev-storage-smoke.mjs
      - run: scripts/validation/test-verification-workflows.sh
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The live-header check must pass against a local emulation of Cloudflare Pages `_headers` handling and must FAIL when the CSP is weakened or a header is dropped.
      - run: npm run test:headers
      # Real-browser smoke (network intercepted, fixtures generated from the real DB). Uses the Chrome preinstalled on GitHub runners.
      - run: CHROME_PATH="$(command -v google-chrome || command -v chromium-browser || command -v chromium)" npm run test:e2e
  database:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ['16', '17']          # Supabase projects currently run PostgreSQL 17; 16 kept for parity with local development
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env: { POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: PGURL=postgresql://postgres@localhost:5432 scripts/validation/db-test.sh
